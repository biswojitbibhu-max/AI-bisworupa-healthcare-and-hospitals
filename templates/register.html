{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>
        Create Account
    </h1>

    <form method="POST">

        <label>
            Full Name
        </label>

        <input
            type="text"
            name="name"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">
            Register
        </button>

    </form>

</div>

{% endblock %}
